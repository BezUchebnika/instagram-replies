name: Instagram autoreply

on:
  schedule:
    - cron: "*/10 * * * *"  # каждые 10 мин (GitHub может запускать с задержкой)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только проверка: показать, кому ушёл бы ответ, ничего не отправляя"
        type: boolean
        default: true
      first_run:
        description: "Самый первый запуск: что делать со старыми комментариями (потом не важно)"
        type: choice
        default: "ответить за последние 7 дней"
        options:
          - "ответить за последние 7 дней"
          - "только запомнить, не отвечать"

concurrency:
  group: autoreply
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # чтобы запуск мог сам запустить следующий

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo "STARTED_TS=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Проверить комментарии и ответить
        id: reply
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FIRST_RUN_CHOICE: ${{ inputs.first_run }}
        run: |
          case "$FIRST_RUN_CHOICE" in
            "ответить за последние 7 дней") export FIRST_RUN=backlog ;;
            "только запомнить, не отвечать") export FIRST_RUN=remember ;;
            *) export FIRST_RUN="" ;;
          esac
          python autoreply.py
      - name: Сохранить, кому уже ответили
        if: always()
        run: |
          git config user.name "autoreply-bot"
          git config user.email "autoreply-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Обновить список обработанных комментариев"
          git pull --rebase
          git push
      - name: Запустить следующий шаг, пока очередь не разобрана
        # Запасной механизм на случай, когда GitHub не запускает расписание.
        # Работает только пока есть хвост очереди; если плановые запуски идут, не нужен.
        if: always() && steps.reply.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          recent=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/autoreply.yml/runs?event=schedule&per_page=1" \
            | python3 -c "import json,sys,datetime as d;r=json.load(sys.stdin)['workflow_runs'];print('yes' if r and (d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(r[0]['created_at'].replace('Z','+00:00'))).total_seconds()<1800 else 'no')")
          if [ "$recent" = yes ]; then echo "Расписание работает, цепочка не нужна"; exit 0; fi
          elapsed=$(( $(date +%s) - STARTED_TS ))
          wait=$(( 600 - elapsed )); [ $wait -gt 0 ] && sleep $wait
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/autoreply.yml/dispatches" \
            -d '{"ref":"main","inputs":{"dry_run":"false"}}'
          echo "Следующий шаг запущен"
