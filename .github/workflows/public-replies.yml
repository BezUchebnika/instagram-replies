name: Public replies

# Только публичные ответы под комментариями. Директ отправляет встроенная автоматизация Meta.
on:
  schedule:
    - cron: "17,47 * * * *"  # раз в 30 минут
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только проверка: показать, кому был бы ответ, ничего не публикуя"
        type: boolean
        default: true

concurrency:
  group: public-replies
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - run: echo "STARTED_TS=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Опубликовать ответы под комментариями
        id: reply
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python public_replies.py
      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "autoreply-bot"
          git config user.email "autoreply-bot@users.noreply.github.com"
          git add public_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Обновить состояние публичных ответов"
          git pull --rebase
          git push
      - name: Запустить следующий шаг, если расписание GitHub не работает
        # Только после успешного боевого запуска; при ошибке цепочка обрывается.
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          recent=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/public-replies.yml/runs?event=schedule&per_page=1" \
            | python3 -c "import json,sys,datetime as d;r=json.load(sys.stdin)['workflow_runs'];print('yes' if r and (d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(r[0]['created_at'].replace('Z','+00:00'))).total_seconds()<2700 else 'no')")
          if [ "$recent" = yes ]; then echo "Расписание работает, цепочка не нужна"; exit 0; fi
          elapsed=$(( $(date +%s) - STARTED_TS ))
          wait=$(( 1800 - elapsed )); [ $wait -gt 0 ] && sleep $wait
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/public-replies.yml/dispatches" \
            -d '{"ref":"main","inputs":{"dry_run":"false"}}'
          echo "Следующий шаг запущен"
