# Кодовые слова и сообщения, которые уходят в директ автору комментария.
#
# Как добавить слово: скопируйте блок «чекап» ниже, поменяйте слово и текст.
# also: другие написания, на которые тоже реагировать (регистр и «ё/е» не важны).
# message: текст сообщения. Перенос строки внутри текста сохраняется.
# enabled: false временно выключает слово, не удаляя его.
# Слово без текста сообщения скрипт пропускает.

keywords:
  чекап:
    also: [чек ап, чек-ап, checkup, check up]
    enabled: true
    # Текст взять из Instant Reply в Meta Business Suite. Пока пусто, слово не работает.
    message: ""
