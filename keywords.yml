# Кодовые слова и сообщения, которые уходят в директ автору комментария.
#
# Как добавить слово: скопируйте блок «чекап» ниже, поменяйте слово и тексты.
# also: другие написания, на которые тоже реагировать. Регистр, «ё/е», дефисы,
#   знаки и латинские буквы-двойники (c, e, a, o, p, x) внутри русских слов не важны.
# message: текст сообщения в директ. Переносы строк сохраняются.
# comment_replies: публичные ответы под комментарием, каждый раз выбирается
#   случайный. Ответ публикуется, только если сообщение в директ ушло.
#   Если список пустой, публичного ответа нет.
# enabled: false временно выключает слово, не удаляя его.

keywords:
  чекап:
    also:
      - чекан
      - чекам
      - чека
      - чек ап
      - check up
      - checkup
      - chekap
      - chek up
      - checkap
    enabled: true
    message: |
      Hi! Чекап по временам английского можно пройти по ссылке: https://bezuchebnika.github.io/Find-Your-Weak-Spot-in-English-Tenses/

      За 5–10 минут увидите, какие времена уже освоили, а где чаще ошибаетесь.

      А если хотите разобраться, почему времена путаются, посмотрите моё видео «СХЕМА, которая исправит ваш английский»: https://youtu.be/pyc2yslEo9Q

      Если появятся вопросы про английский или занятия, пишите, с радостью отвечу.
    comment_replies:
      - Sent it! Check your DMs (message requests) ☺️ / Отправил! Проверьте директ (запросы на переписку).
      - Done! It’s in your DMs. / Готово! Он в директе.
      - Just sent it your way. / Только что отправил вам.
      - Check your inbox, it might be in requests ☺️ / Проверьте сообщения, может быть в запросах.
      - Sent! Let me know how it goes ☺️ / Отправил! Напишите, как получится.
      - It’s in your DMs, good luck! / Он в директе, удачи!
      - On its way! Check message requests ☺️ / Уже в пути! Проверьте запросы на переписку.
      - Check your DMs, I just sent it ☺️ / Проверьте директ, я только что отправил.
